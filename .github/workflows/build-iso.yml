name: Build Jarvis OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build ISO using Docker
      run: |
        docker build -t jarvis-os-builder -f os-builder/Dockerfile .
        docker run --privileged -v ${{ github.workspace }}:/output jarvis-os-builder

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-iso
        path: jarvis-os.iso
        if-no-files-found: error
